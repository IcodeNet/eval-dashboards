name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        node-version: [22.14.0]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          node -v
          npm -v

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml missing in this ref; using --no-frozen-lockfile fallback"
            pnpm install --no-frozen-lockfile
          fi

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION, tag=v$TAG_VERSION"
            exit 1
          fi
          echo "✓ Version verified: $PKG_VERSION"

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          # Extract the release notes from CHANGELOG.md for the current version
          VERSION=${{ steps.version.outputs.version }}

          # Find the section for this version and extract until the next version or file end
          RELEASE_NOTES=$(awk "
            /^## \[$VERSION\]/{flag=1; next}
            /^## \[/{if(flag) exit}
            flag
          " CHANGELOG.md)

          if [ -z "$RELEASE_NOTES" ]; then
            echo "Warning: No release notes found for version $VERSION in CHANGELOG.md"
            RELEASE_NOTES="See CHANGELOG.md for details"
          fi

          # Store in GitHub output (handle multiline)
          {
            echo 'notes<<EOF'
            echo "$RELEASE_NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Verify OIDC availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token request URL is not available in this job."
            echo "Trusted publishing cannot proceed without id-token: write."
            exit 1
          fi
          echo "OIDC token request URL is available."

      - name: Diagnose npm OIDC exchange
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is missing."
            exit 1
          fi

          OIDC_RESP=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          OIDC_TOKEN=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(0,'utf8')); process.stdout.write(x.value||'')" <<< "$OIDC_RESP")

          if [ -z "$OIDC_TOKEN" ]; then
            echo "Failed to obtain OIDC token for npm audience."
            echo "$OIDC_RESP"
            exit 1
          fi

          PKG_PATH=$(node -e "const n=require('./package.json').name; process.stdout.write(encodeURIComponent(n))")
          STATUS=$(curl -sS -o /tmp/npm-oidc-exchange.json -w "%{http_code}" -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG_PATH}" -H "Authorization: Bearer ${OIDC_TOKEN}")

          echo "npm OIDC exchange status: $STATUS"
          cat /tmp/npm-oidc-exchange.json

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "npm OIDC token exchange failed. See response above."
            exit 1
          fi

          echo "npm OIDC token exchange succeeded."

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            rm -f "${NPM_CONFIG_USERCONFIG}"
          fi
          npm publish --access public

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
