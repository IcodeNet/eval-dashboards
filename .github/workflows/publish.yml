name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        node-version: [22.14.0]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          node -v
          npm -v

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml missing in this ref; using --no-frozen-lockfile fallback"
            pnpm install --no-frozen-lockfile
          fi

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION, tag=v$TAG_VERSION"
            exit 1
          fi
          echo "✓ Version verified: $PKG_VERSION"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate release and generated assets
        run: pnpm release:prepare

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          # Extract the release notes from CHANGELOG.md for the current version
          VERSION=${{ steps.version.outputs.version }}

          # Find the section for this version and extract until the next version or file end
          RELEASE_NOTES=$(awk "
            /^## \[$VERSION\]/{flag=1; next}
            /^## \[/{if(flag) exit}
            flag
          " CHANGELOG.md)

          if [ -z "$RELEASE_NOTES" ]; then
            echo "Warning: No release notes found for version $VERSION in CHANGELOG.md"
            RELEASE_NOTES="See CHANGELOG.md for details"
          fi

          # Store in GitHub output (handle multiline)
          {
            echo 'notes<<EOF'
            echo "$RELEASE_NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Verify OIDC availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token request URL is not available in this job."
            echo "Trusted publishing cannot proceed without id-token: write."
            exit 1
          fi
          echo "OIDC token request URL is available."

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            rm -f "${NPM_CONFIG_USERCONFIG}"
          fi
          npm publish --access public

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
