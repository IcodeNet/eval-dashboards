name: Adoption Metrics

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh adoption snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm metrics:adoption

      - name: Commit snapshot updates
        run: |
          if [ -n "$(git status --porcelain -- docs/adoption-metrics/latest.json docs/adoption-metrics/manual-signals.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/adoption-metrics/latest.json docs/adoption-metrics/manual-signals.json
            git commit -m "chore: refresh adoption metrics snapshot"
            git push
          else
            echo "No adoption metrics changes to commit"
          fi
