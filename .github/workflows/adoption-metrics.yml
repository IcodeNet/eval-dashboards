name: Adoption Metrics

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh adoption snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm metrics:adoption

      - name: Upload snapshot for PR review
        uses: actions/upload-artifact@v7
        with:
          name: adoption-metrics-snapshot
          path: |
            docs/adoption-metrics/latest.json
            docs/adoption-metrics/manual-signals.json
          if-no-files-found: error
          retention-days: 30

      - name: Explain snapshot review
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          The adoption snapshot is available in the adoption-metrics-snapshot artifact.
          Download it, compare latest.json with the tracked snapshot, and submit reviewed changes through the repository PR template.
          Manual signals remain maintainer-verified. This job does not commit or push to main.
          See docs/adoption-feedback-loop.md for the ordinary review workflow.
          EOF
