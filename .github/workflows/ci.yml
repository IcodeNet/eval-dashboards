name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Includes stacked PRs whose base is another feature branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify hosted PostgreSQL storage foundation
        run: pnpm test:hosted-db

      - name: Build
        run: pnpm build

      - name: Verify commit evidence safeguards
        run: pnpm test:commit-hooks

      - name: Verify packed-package consumer
        run: pnpm verify:package

      # Keep the full development suite on Node 22; exercise the installed
      # tarball separately on the other advertised even-numbered runtimes.
      - name: Setup Node 20 for packed-package compatibility
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Verify strict installed package on Node 20
        run: node scripts/verify-packed-package.mjs

      - name: Setup Node 24 for packed-package compatibility
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Verify strict installed package on Node 24
        run: node scripts/verify-packed-package.mjs

      - name: Setup Node 26 for packed-package compatibility
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Verify strict installed package on Node 26
        run: node scripts/verify-packed-package.mjs

      - name: Restore Node 22 for remaining checks
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install release-asset browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify deterministic release assets
        run: pnpm assets:verify

      - name: Verify report accessibility (axe-core)
        run: pnpm a11y:verify

      - name: Verify eval-report schema drift guard
        run: pnpm schema:check

      - name: Verify report-power artifact drift guard
        run: |
          pnpm artifacts:report-power
          git diff --exit-code -- examples/report-power-artifacts
          test -z "$(git status --porcelain -- examples/report-power-artifacts)"

      - name: Verify CLI help snapshots and scaffold/completion guards
        run: pnpm verify:cli

      - name: Verify teaching docs match real CLI output
        run: pnpm teach:verify

      - name: Verify every CLI flag is documented outside generated help
        run: pnpm docs:flags

      - name: Build docs site and check its links
        run: |
          pnpm docs:build
          pnpm docs:check

      - name: Dependency audit (fails on high/critical)
        run: pnpm audit --audit-level=high

  examples:
    runs-on: ubuntu-latest
    needs: lint-and-test

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test basic-json example
        run: pnpm dev report --input=examples/basic-json --reporter=text

      - name: Test llm-agent-evals example
        run: pnpm example:llm-agent-report
