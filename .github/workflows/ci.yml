name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify eval-report schema drift guard
        run: pnpm schema:check

      - name: Verify report-power artifact drift guard
        run: |
          pnpm artifacts:report-power
          git diff --exit-code -- examples/report-power-artifacts
          test -z "$(git status --porcelain -- examples/report-power-artifacts)"

      - name: Verify CLI help snapshots and scaffold/completion guards
        run: pnpm verify:cli

      - name: Verify teaching docs match real CLI output
        run: pnpm teach:verify

      - name: Dependency audit (fails on high/critical)
        run: pnpm audit --audit-level=high

  examples:
    runs-on: ubuntu-latest
    needs: lint-and-test

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test basic-json example
        run: pnpm dev report --input=examples/basic-json --reporter=text

      - name: Test llm-agent-evals example
        run: pnpm example:llm-agent-report
